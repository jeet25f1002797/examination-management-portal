
{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <section class="admin-panel">

            <h3 class="mb-4">Edit Course</h3>

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Course Code</label>
                    <input
                        type="text"
                        name="code"
                        class="form-control"
                        value="{{ course.code }}"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Course Name</label>
                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        value="{{ course.name }}"
                        required>
                </div>

                <button type="submit" class="btn btn-primary">
                    Update Course
                </button>

                <a href="{{ url_for('dashboard') }}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </section>

    </div>
</div>

{% endblock %}
